# Use zsh as the default shell inside tmux (covers both Linux and macOS paths)
set -g default-shell /bin/zsh
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Set the duration (in milliseconds) that pane numbers are displayed when switching panes.
set -g display-panes-time 3000

# Set vi key bindings on copy mode
set -g mode-keys vi

# Open new panes/windows in the current pane's working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pick a directory, then name and switch to the new session.
bind-key C-c display-popup -E -d "#{pane_current_path}" "~/bin/tmux-new-session"

# prefix + i -> popup listing every window with its full name (id + Linear
# title), pick one to jump to it. The bar only has room for the active title.
bind-key i display-popup -E -w 80% -h 40% "~/bin/tmux-window-pick"

# Ctrl+Shift+T -> new window (terminal-style "new tab")
# Note: tmux can't distinguish Ctrl+Shift+T from Ctrl+T; this shadows readline transpose-chars.
bind -n C-T new-window

# Number windows from 1 so Alt+N lands on the Nth window, and close the gaps
# when one is killed -- otherwise Alt+3 stops matching the third window.
set -g base-index 1
set -g renumber-windows on

# Alt+N -> jump straight to the Nth window, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+O -> open this window's Linear issue in the browser (window name starts
# with the id). Non-Linear windows just get a tmux message.
bind -n M-o run-shell 'linear-open "#{window_name}"'

# Alt+N / Alt+P -> next / previous window. Shadows zsh's history-search-forward
# and history-search-backward; arrow keys plus autosuggestions cover those.
bind -n M-n next-window
bind -n M-p previous-window

# Alt+Tab -> back to the previous window. Needs GNOME's Alt+Tab freed:
#   gsettings set org.gnome.desktop.wm.keybindings switch-windows "[]"
# (app switching stays on Super+Tab). Backtick kept as a fallback.
bind -n M-Tab last-window
bind -n M-` last-window

# Alt+L -> back to the previous session (same as the default prefix + L).
# Shadows zsh's down-case-word, which is no loss.
bind -n M-l switch-client -l

# ===============================================
# Status bar (minimal, top-positioned)
# ===============================================

# Put the status bar at the top of the screen
set -g status-position top

# Two-line status with an empty second line = padding between bar and content
set -g status 2
set -g status-format[1] ""

# How often the status bar refreshes (seconds) — enough for the clock
set -g status-interval 5

# Left side: current session name, then the window list
# (chip inverts while the Ctrl+B prefix is armed)
set -g status-justify left
set -g status-left "#[fg=#e0af68,bold]#{?client_prefix,#[reverse],} 🔥#S #[default] "
set -g status-left-length 30

# Base bar style: inherit the terminal background, muted default text
set -g status-style "bg=default fg=#565f89"

# Right side: human-friendly date with a clock, e.g. "Fri 3 Jul · 01:04"
set -g status-right "#[fg=#73daca]%a %-d %b · %H:%M "
set -g status-right-length 40

# Name windows after their current directory instead of the shell name
set -g automatic-rename-format '#{b:pane_current_path}'

# Window names from `wt` are "CE-8334 Some Linear title". Showing every title
# would blow out the bar, so inactive windows get everything before the first
# space (the bare id) and only the active one spends the room on the title.

# Inactive windows: muted gray "N: id + a bit of title", but drop back to the
# bare id once there are enough windows that the titles would not fit.
set -g window-status-format "#[fg=#565f89]#I: #{?#{<:#{session_windows},7},#{=24:window_name},#{s/ .*//:window_name}}"

# Active window: amber highlight box, id + title (clipped so a long one can't
# push the clock off the bar)
set -g window-status-current-format "#[fg=#1a1b26,bg=#e0af68,bold] #I: #{=60:window_name} "

# Dim divider between window entries -- with titles in the bar the names run
# together otherwise. Dimmer than the inactive text so it reads as a rule.
set -g window-status-separator "#[fg=#3b4261,none] │ "

# ===============================================
# TPM (Tmux Plugin Manager)
# ===============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Resurrect saves window names but not window options, so restored windows come
# back with automatic-rename on and get renamed to the directory basename --
# which for a worktree is the bare issue id, losing the Linear title. Put it
# back after every restore (titles are cached, so this costs no API calls).
set -g @resurrect-hook-post-restore-all '~/bin/tmux-title-sync'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
